name: Legal pages (GitHub Pages)

# Публикует store-документы из docs/ на GitHub Pages:
#   /                         — оглавление правовых документов
#   /privacy.html             — политика конфиденциальности (RU)
#   /privacy-en.html          — Privacy Policy (EN)
# Деплой идёт артефактом, поэтому сайт остаётся живым независимо от судьбы ветки.
on:
  push:
    branches: [main, arena/257086d4-game]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
