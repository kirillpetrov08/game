name: RuStore screenshots

# Скриншоты 1080x1920 с русским интерфейсом для карточки RuStore.
# Результат коммитится в ту же ветку, с которой запущен workflow (store/rustore/screenshots).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run in emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/rustore_shots.sh

      - name: Upload screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustore-screenshots
          path: |
            shots/*.png
            shots/coords.txt
          if-no-files-found: ignore

      - name: Commit screenshots to the branch
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add store/rustore/screenshots shots/coords.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "RuStore screenshots (1080x1920, ru-RU)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
