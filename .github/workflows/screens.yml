name: Emulator screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emu_test.sh

      - name: Publish shots to branch
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          mkdir -p /tmp/shots && cp -r shots/* /tmp/shots/ || true
          git checkout --orphan ci-shots
          git rm -rf . > /dev/null 2>&1 || true
          cp -r /tmp/shots/* . || true
          git add -A
          git commit -m "emulator screenshots" || true
          git push -f origin ci-shots
